[package]
name = "axolotl-notch"
version = "0.1.0"
edition = "2024"
description = "Daemon y hooks para un compañero ajolote en la barra de Quickshell/Caelestia"
license = "MIT"

[[bin]]
name = "axolotl-daemon"
path = "src/bin/daemon.rs"

[[bin]]
name = "axolotl-hook"
path = "src/bin/hook.rs"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "io-util", "sync", "signal", "time", "process"] }
